services:
  smard-probabilistic:
    build: .
    environment:
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTORCH_NUM_THREADS: "1"
    ports:
      - "8501:8501"
    volumes:
      - ./smard_daten/input:/app/data/input
      - ./smard_daten/output:/app/data/output
